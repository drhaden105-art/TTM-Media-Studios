<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTM Media Studios</title>
<style>
:root{--purple:#32105d;--purple2:#51218a;--gold:#d6ad55;--ink:#21172b;--muted:#766d80;--paper:#faf8fc;--line:#e9e1ef}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(180deg,#281047,#3d176c);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid #ffffff28}.crest{width:48px;height:54px;border:2px solid var(--gold);border-radius:12px 12px 17px 17px;display:grid;place-items:center;color:var(--gold);font-size:24px;font-weight:800}.brand strong{display:block;font-size:17px;line-height:1.2}.brand small{color:#d9c9ec}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#e8def2;text-align:left;padding:12px 14px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff1b;color:white}.nav .ico{width:22px;text-align:center;font-size:18px}.side-note{margin-top:auto;color:#d4c2e7;font-size:12px;padding:10px}.main{min-width:0}.top{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top h1{font-size:19px;margin:0;color:var(--purple)}.tag{background:#f4edf9;color:var(--purple);border:1px solid #e8d9f2;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700}.content{padding:30px;max-width:1400px;margin:auto}.welcome{background:linear-gradient(120deg,#32105d,#60349a);border-radius:18px;color:white;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.welcome h2{font-size:27px;margin:0 0 7px}.welcome p{margin:0;color:#e4d8f1}.welcome .seal{font-size:54px;color:var(--gold);padding:10px 18px;border:2px solid #d6ad5588;border-radius:18px}.section-title{font-size:19px;margin:26px 0 14px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;text-align:left;box-shadow:0 4px 16px #29104408;transition:.15s}.tile:hover{transform:translateY(-2px);border-color:#cbb3dd}.tile .big{font-size:25px}.tile h3{margin:9px 0 4px}.tile p{margin:0;color:var(--muted);font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.panel h2,.panel h3{margin:0 0 14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#51445f}.field input,.field textarea,.field select{width:100%;border:1px solid #d9cfe1;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--purple);color:white;font-weight:700}.btn:hover{background:var(--purple2)}.btn.gold{background:var(--gold);color:#291b08}.btn.light{background:#f2edf6;color:var(--purple)}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted);font-size:13px}.preview{background:#21172b;border-radius:12px;overflow:hidden;min-height:180px;display:grid;place-items:center;color:#cbb9dc;text-align:center;padding:15px}.preview img,.preview video{max-width:100%;max-height:440px;display:block}.canvaswrap{background:#eee9f2;border-radius:12px;padding:12px;display:grid;place-items:center;overflow:auto}.canvaswrap canvas{max-width:100%;height:auto;background:#ddd}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.notice{padding:12px 14px;background:#f7f1e5;border:1px solid #ead9b4;border-radius:10px;color:#634a1b;font-size:13px;margin:12px 0}.back{border:0;background:none;color:var(--purple);font-weight:700;padding:0;margin-bottom:16px}.foot{font-size:12px;color:var(--muted);padding:15px 2px}.stat{font-size:28px;font-weight:800;color:var(--purple)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:12px;gap:10px}.brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.side-note{display:none}.content{padding:17px}.top{padding:0 18px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome{padding:22px}.welcome .seal{display:none}}@media(max-width:560px){.tiles,.grid2{grid-template-columns:1fr}.top{height:60px}.welcome h2{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="crest">✝</div><div><strong>TTM MEDIA<br>STUDIOS</strong><small>Throne Temple Ministries</small></div></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span>Dashboard</button>
  <button data-page="sermon"><span class="ico">▶</span>Sermon</button>
  <button data-page="clips"><span class="ico">▣</span>Clips</button>
  <button data-page="photos"><span class="ico">▧</span>Photos</button>
  <button data-page="effects"><span class="ico">✧</span>Effects</button>
  <button data-page="minister"><span class="ico">♟</span>Ministering Now</button>
  <button data-page="flyers"><span class="ico">▤</span>Flyers</button>
 </nav>
 <div class="side-note">Manual media workspace · No AI tools</div>
</aside>
<main class="main">
 <header class="top"><h1 id="pageTitle">Dashboard</h1><span class="tag">TTM · MEDIA TEAM</span></header>
 <div class="content" id="content"></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');
const titles={home:'Dashboard',sermon:'Sermon Thumbnail Studio',clips:'Clip Studio',photos:'Photo Editor',effects:'Worship & Praise Effects',minister:'Ministering Now',flyers:'Flyer Studio'};
let page='home',sermonImg=null,photoImg=null,flyerImg=null,clipUrl=null,effectUrl=null;
function setPage(p){page=p;$('#pageTitle').textContent=titles[p];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function home(){return `<section class="welcome"><div><h2>Welcome to TTM Media Studios</h2><p>Your church media workspace for sermons, clips, photos, worship visuals and flyers.</p><div class="btnrow"><button class="btn gold" onclick="setPage('sermon')">Create a sermon thumbnail</button><button class="btn light" onclick="setPage('flyers')">Open flyer studio</button></div></div><div class="seal">✝</div></section><h2 class="section-title">Choose a workspace</h2><div class="tiles">
<button class="tile" onclick="setPage('sermon')"><span class="big">▶️</span><h3>Sermon</h3><p>Build a sermon thumbnail using your title, video link and preacher photo.</p></button>
<button class="tile" onclick="setPage('clips')"><span class="big">🎬</span><h3>Clips</h3><p>Load a video and prepare short moments with captions.</p></button>
<button class="tile" onclick="setPage('photos')"><span class="big">🖼️</span><h3>Photos</h3><p>Edit photos you upload with manual adjustments.</p></button>
<button class="tile" onclick="setPage('effects')"><span class="big">✨</span><h3>Effects</h3><p>Preview visual effects for worship and praise videos.</p></button>
<button class="tile" onclick="setPage('minister')"><span class="big">🎤</span><h3>Ministering Now</h3><p>Display the current minister using your service flyer.</p></button>
<button class="tile" onclick="setPage('flyers')"><span class="big">📄</span><h3>Flyers</h3><p>Load, preview and download your church flyers.</p></button>
</div><div class="notice">Your uploads and edits stay in this browser on this device. This starter version does not upload files to a server or share them with the team.</div>`}
function sermon(){return `<button class="back" onclick="setPage('home')">← Dashboard</button><div class="grid2"><section class="panel"><h2>Create a sermon thumbnail</h2><div class="field"><label>Sermon title</label><input id="serTitle" placeholder="Enter the message title"></div><div class="field"><label>Preacher name</label><input id="preacher" placeholder="Enter preacher's name"></div><div class="field"><label>Video link (optional)</label><input id="serLink" placeholder="Paste YouTube or video link"></div><div class="field"><label>Service date</label><input id="serDate" type="date"></div><div class="field"><label>Preacher photo</label><input id="serPhoto" type="file" accept="image/*"></div><p class="muted">The background is created automatically from the sermon title. You only need to add the preacher photo.</p><div class="btnrow"><button class="btn" onclick="makeSermon()">Create thumbnail</button><button class="btn light" onclick="downloadCanvas('sermonCanvas','TTM-sermon-thumbnail.png')">Download PNG</button></div></section><section class="panel"><h3>Thumbnail preview</h3><div class="canvaswrap"><canvas id="sermonCanvas" width="1280" height="720"></canvas></div><p class="muted">Preview is 16:9. Add your title and preacher photo, then create and download.</p></section></div>`}
function clips(){return `<button class="back" onclick="setPage('home')">← Dashboard</button><section class="panel"><h2>Make a clip from your video</h2><p class="muted">Load a video file from your device. Choose the moment you want and add a caption. This browser-only starter lets you preview and mark the clip; it does not alter the original video.</p><div class="field"><label>Choose video</label><input id="clipFile" type="file" accept="video/*"></div><div class="preview" id="clipPreview">Your video preview will appear here.</div><div class="grid2"><div class="field"><label>Start time (seconds)</label><input id="clipStart" type="number" min="0" value="0"></div><div class="field"><label>End time (seconds)</label><input id="clipEnd" type="number" min="1" value="30"></div></div><div class="field"><label>Caption</label><textarea id="clipCaption" placeholder="Type the caption for this clip"></textarea></div><div class="btnrow"><button class="btn" onclick="previewClip()">Preview selected moment</button><button class="btn light" onclick="copyCaption()">Copy caption</button></div><div class="notice">For a finished edited clip with embedded captions, use a video editor such as Clipchamp. This page keeps the source video unchanged.</div></section>`}
function photos(){return `<button class="back" onclick="setPage('home')">← Dashboard</button><div class="grid2"><section class="panel"><h2>Photo editor</h2><div class="field"><label>Upload your photo</label><input id="photoFile" type="file" accept="image/*"></div><div class="field"><label>Brightness <span id="brightVal">100%</span></label><input id="bright" type="range" min="40" max="180" value="100"></div><div class="field"><label>Contrast <span id="contrastVal">100%</span></label><input id="contrast" type="range" min="40" max="180" value="100"></div><div class="field"><label>Saturation <span id="satVal">100%</span></label><input id="sat" type="range" min="0" max="200" value="100"></div><div class="btnrow"><button class="btn" onclick="applyPhoto()">Apply adjustments</button><button class="btn light" onclick="resetPhoto()">Reset</button><button class="btn light" onclick="downloadCanvas('photoCanvas','TTM-edited-photo.png')">Download photo</button></div></section><section class="panel"><h3>Photo preview</h3><div class="canvaswrap"><canvas id="photoCanvas" width="900" height="600"></canvas></div></section></div>`}
function effects(){return `<button class="back" onclick="setPage('home')">← Dashboard</button><section class="panel"><h2>Worship & praise visual effects</h2><p class="muted">Load your own video and preview simple visual looks. Your original file is not changed.</p><div class="field"><label>Choose video</label><input id="effectFile" type="file" accept="video/*"></div><div class="field"><label>Visual look</label><select id="effectSelect"><option value="none">Original</option><option value="brightness(1.2) saturate(1.25)">Bright & vibrant</option><option value="grayscale(1)">Black & white</option><option value="sepia(.65)">Warm vintage</option><option value="contrast(1.35) saturate(1.3)">High contrast</option><option value="hue-rotate(35deg) saturate(1.4)">Color shift</option></select></div><div class="preview" id="effectPreview">Your worship or praise video preview will appear here.</div><div class="btnrow"><button class="btn" onclick="applyEffect()">Apply preview effect</button></div></section>`}
function minister(){return `<button class="back" onclick="setPage('home')">← Dashboard</button><section class="panel"><h2>Ministering Now</h2><p class="muted">Use the same Sunday service flyer from the Flyers workspace. Upload it there and it will appear here in this browser.</p><div class="preview" id="ministerPreview">${flyerImg?'<img src="'+flyerImg+'" alt="Current service flyer">':'No Sunday service flyer loaded yet.'}</div><div class="btnrow"><button class="btn" onclick="setPage('flyers')">Load or change service flyer</button><button class="btn light" onclick="downloadFlyer()">Download current flyer</button></div><div class="field"><label>Who's ministering? (display note)</label><input id="ministerName" placeholder="Enter minister's name"></div><button class="btn" onclick="saveMinister()">Save minister name</button><p class="muted" id="ministerSaved"></p></section>`}
function flyers(){return `<button class="back" onclick="setPage('home')">← Dashboard</button><div class="grid2"><section class="panel"><h2>Flyer studio</h2><p class="muted">Upload a flyer you already have. It will also be used by Ministering Now.</p><div class="field"><label>Choose flyer image</label><input id="flyerFile" type="file" accept="image/*"></div><div class="field"><label>Flyer name (optional)</label><input id="flyerName" placeholder="Sunday Service"></div><div class="btnrow"><button class="btn" onclick="loadFlyer()">Load flyer</button><button class="btn light" onclick="downloadFlyer()">Download flyer</button></div><div class="notice">The flyer is displayed as supplied. To keep the design and wording accurate, this starter version does not automatically rewrite or redesign it.</div></section><section class="panel"><h3>Flyer preview</h3><div class="preview" id="flyerPreview">${flyerImg?'<img src="'+flyerImg+'" alt="Uploaded flyer">':'Upload a flyer to preview it here.'}</div></section></div>`}
function render(){content.innerHTML=({home,sermon,clips,photos,effects,minister,flyers})[page]()}
function loadImage(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cb(im,r.result);im.src=r.result};r.readAsDataURL(file)}
let sermonPreacher=null;
function drawSermonBackground(x,w,h,title){const palettes=[['#160d32','#5b2c83','#b47b43'],['#102b3d','#276b77','#c49a52'],['#30121f','#823b43','#d5a653'],['#172c24','#416b4b','#c9a45b']];let hash=0;for(let i=0;i<title.length;i++)hash=(hash*31+title.charCodeAt(i))>>>0;const p=palettes[hash%palettes.length];const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,p[0]);g.addColorStop(.58,p[1]);g.addColorStop(1,p[2]);x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<18;i++){const xx=(hash*(i+7)%w),yy=(hash*(i+13)%(h+200))-100,r=45+(hash+i*37)%170;x.beginPath();x.arc(xx,yy,r,0,Math.PI*2);x.fillStyle='rgba(255,255,255,'+(0.018+(i%4)*.009)+')';x.fill()}x.strokeStyle='rgba(235,202,130,.24)';x.lineWidth=3;for(let i=0;i<5;i++){x.beginPath();x.arc(w*.48,h*.5,120+i*62,0,Math.PI*2);x.stroke()}x.fillStyle='rgba(16,8,30,.48)';x.fillRect(0,0,w,h)}
function makeSermon(){const c=$('#sermonCanvas'),x=c.getContext('2d'),title=$('#serTitle').value||'SUNDAY MESSAGE',name=$('#preacher').value||'THRONE TEMPLE MINISTRIES',date=$('#serDate').value;x.fillStyle='#271044';x.fillRect(0,0,c.width,c.height);drawSermonBackground(x,c.width,c.height,title);x.fillStyle='rgba(30,10,55,.66)';x.fillRect(0,0,800,720);if(sermonPreacher){x.save();x.beginPath();x.arc(1020,360,285,0,Math.PI*2);x.clip();x.drawImage(sermonPreacher,735,75,570,570);x.restore()}x.fillStyle='#d9b45f';x.font='bold 34px Arial';x.fillText('THRONE TEMPLE MINISTRIES',65,85);x.fillStyle='white';let words=title.toUpperCase().split(' '),lines=[],line='';for(const w of words){if((line+' '+w).trim().length>17){lines.push(line);line=w}else line=(line+' '+w).trim()}if(line)lines.push(line);x.font='bold 76px Arial';lines.slice(0,4).forEach((l,i)=>x.fillText(l,65,250+i*95));x.fillStyle='#e0bc68';x.font='bold 34px Arial';x.fillText(name,65,625);x.fillStyle='#eee';x.font='24px Arial';x.fillText(date||'SUNDAY SERVICE',65,670)}
$('#content').addEventListener('change',e=>{if(e.target.id==='serPhoto')loadImage(e.target.files[0],im=>{sermonPreacher=im});if(e.target.id==='photoFile')loadImage(e.target.files[0],(im)=>{photoImg=im;applyPhoto()});if(e.target.id==='clipFile'){const f=e.target.files[0];if(f){clipUrl=URL.createObjectURL(f);$('#clipPreview').innerHTML='<video controls src="'+clipUrl+'" style="max-width:100%;max-height:420px"></video>'}}if(e.target.id==='effectFile'){const f=e.target.files[0];if(f){effectUrl=URL.createObjectURL(f);$('#effectPreview').innerHTML='<video controls src="'+effectUrl+'" style="max-width:100%;max-height:420px"></video>'}}if(['bright','contrast','sat'].includes(e.target.id)){const v=e.target.value;$('#'+({bright:'brightVal',contrast:'contrastVal',sat:'satVal'}[e.target.id])).textContent=v+'%';applyPhoto()}});
function applyPhoto(){if(!photoImg)return;const c=$('#photoCanvas'),x=c.getContext('2d'),scale=Math.min(900/photoImg.width,600/photoImg.height),w=photoImg.width*scale,h=photoImg.height*scale;c.width=w;c.height=h;x.filter='brightness('+($('#bright')?.value||100)+'%) contrast('+($('#contrast')?.value||100)+'%) saturate('+($('#sat')?.value||100)+'%)';x.drawImage(photoImg,0,0,w,h);x.filter='none'}
function resetPhoto(){if(!photoImg)return;$('#bright').value=100;$('#contrast').value=100;$('#sat').value=100;$('#brightVal').textContent='100%';$('#contrastVal').textContent='100%';$('#satVal').textContent='100%';applyPhoto()}
function downloadCanvas(id,name){const c=document.getElementById(id);if(!c)return;const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click()}
function previewClip(){const v=$('#clipPreview video');if(!v){alert('Please load a video first.');return}const s=Math.max(0,Number($('#clipStart').value)||0),e=Number($('#clipEnd').value)||v.duration;if(s>=v.duration||e<=s){alert('Please enter a valid start and end time.');return}v.currentTime=s;v.play();const stop=()=>{if(v.currentTime>=Math.min(e,v.duration)){v.pause();v.removeEventListener('timeupdate',stop)}};v.addEventListener('timeupdate',stop)}
function copyCaption(){const t=$('#clipCaption').value;if(!t){alert('Type a caption first.');return}navigator.clipboard?.writeText(t).then(()=>alert('Caption copied.')).catch(()=>alert(t))}
function applyEffect(){const v=$('#effectPreview video');if(!v){alert('Please load a video first.');return}v.style.filter=$('#effectSelect').value}
function loadFlyer(){const f=$('#flyerFile').files[0];if(!f){alert('Choose a flyer image first.');return}loadImage(f,(im,data)=>{flyerImg=data;$('#flyerPreview').innerHTML='<img src="'+data+'" alt="Uploaded flyer">';alert('Flyer loaded. It is now available in Ministering Now on this device.')})}
function downloadFlyer(){if(!flyerImg){alert('Load a flyer first.');return}const a=document.createElement('a');a.href=flyerImg;a.download='TTM-service-flyer.png';a.click()}
function saveMinister(){const n=$('#ministerName').value.trim();if(!n){alert('Enter the minister name first.');return}localStorage.setItem('ttm-minister',n);$('#ministerSaved').textContent='Saved on this device: '+n}
render();
</script>
</body></html>
